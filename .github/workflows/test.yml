name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - run: go vet -unsafeptr=false -lostcancel=false ./...
      - run: go test -v ./...
      - name: Test portable echo-probe correlation
        run: go test -v ./cmd/echo-probe/xcorr.go ./cmd/echo-probe/xcorr_test.go
      - name: Build echo-probe
        run: go build -o echo-probe.exe ./cmd/echo-probe
      - uses: actions/upload-artifact@v4
        with:
          name: echo-probe
          path: echo-probe.exe
          if-no-files-found: error
