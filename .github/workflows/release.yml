name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: 1
      CC: gcc
      CXX: g++
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate version tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw 'Release tag must be vX.Y.Z'
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Test
        run: go test -v ./...
      - name: Build Windows AMD64 GUI
        env:
          CGO_LDFLAGS: -Wl,--subsystem,windows
        run: go build -ldflags="-s -w -H windowsgui" -trimpath -o go-dictate.exe .
      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash go-dictate.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  go-dictate.exe" | Set-Content -Encoding ascii SHA256SUMS.txt
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --title $env:RELEASE_TAG --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release' }
          }
          gh release upload $env:RELEASE_TAG go-dictate.exe SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets' }
