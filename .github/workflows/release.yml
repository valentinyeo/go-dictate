name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v0.1.0'

jobs:
  release:
    name: Create Release
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: true

    - name: Set up MinGW
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: mingw-w64-x86_64-gcc

    - name: Add MinGW to PATH
      run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Get version
      id: version
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $version = "${{ github.event.inputs.version }}"
        } else {
          $version = "${{ github.ref_name }}"
        }
        echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        echo "Building version: $version"
      shell: pwsh

    - name: Download dependencies
      run: |
        go mod tidy
        go mod download

    - name: Build release binary
      run: |
        $env:CGO_ENABLED = "1"
        $version = "${{ steps.version.outputs.VERSION }}"
        go build -v -ldflags="-s -w -H windowsgui -X main.Version=$version" -trimpath -o dictation.exe .
      shell: pwsh

    - name: Create release package
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        $archiveName = "dictation-$version-windows-amd64"

        # Create release directory
        New-Item -ItemType Directory -Force -Path "release\$archiveName"

        # Copy files
        Copy-Item "dictation.exe" "release\$archiveName\"
        Copy-Item "config.sample.toml" "release\$archiveName\"
        Copy-Item "README.md" "release\$archiveName\"
        Copy-Item "QUICKSTART.md" "release\$archiveName\"

        # Create zip
        Compress-Archive -Path "release\$archiveName" -DestinationPath "release\$archiveName.zip"

        # Show package contents
        Write-Host "`nRelease package contents:"
        Get-ChildItem "release\$archiveName" -Recurse

        Write-Host "`nPackage size:"
        Get-Item "release\$archiveName.zip" | Select-Object Name, Length
      shell: pwsh

    - name: Generate checksums
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        $archiveName = "dictation-$version-windows-amd64"

        cd release

        # SHA256 checksum
        $hash = Get-FileHash "$archiveName.zip" -Algorithm SHA256
        "$($hash.Hash)  $archiveName.zip" | Out-File -FilePath "checksums.txt" -Encoding utf8

        Write-Host "`nChecksums:"
        Get-Content "checksums.txt"
      shell: pwsh

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        name: Release ${{ steps.version.outputs.VERSION }}
        draft: false
        prerelease: false
        body: |
          ## Go Dictation App ${{ steps.version.outputs.VERSION }}

          Windows system tray dictation app using Deepgram API.

          ### Installation

          1. Download `dictation-${{ steps.version.outputs.VERSION }}-windows-amd64.zip`
          2. Extract to a folder
          3. Run `dictation.exe`
          4. Right-click tray icon → Settings
          5. Add your Deepgram API key
          6. Restart and start dictating!

          ### Requirements

          - Windows 10/11
          - Microphone
          - Deepgram API key (free at https://console.deepgram.com/)

          ### What's Included

          - `dictation.exe` - Main application
          - `config.sample.toml` - Sample configuration
          - `README.md` - Full documentation
          - `QUICKSTART.md` - Quick start guide

          ### Checksums

          See `checksums.txt` for SHA256 verification.

          ---

          Full documentation: [README.md](https://github.com/${{ github.repository }})
        files: |
          release/*.zip
          release/checksums.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
