name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: true

    - name: Set up MinGW
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: mingw-w64-x86_64-gcc

    - name: Add MinGW to PATH
      run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Verify Go installation
      run: go version

    - name: Verify GCC installation
      run: gcc --version

    - name: Download dependencies
      run: go mod download

    - name: Build application
      run: |
        $env:CGO_ENABLED = "1"
        go build -v -ldflags="-s -w -H windowsgui" -trimpath -o dictation.exe .
      shell: pwsh

    - name: Check binary
      run: |
        if (Test-Path dictation.exe) {
          $size = (Get-Item dictation.exe).Length / 1MB
          Write-Host "✓ Build successful!"
          Write-Host "Binary size: $([math]::Round($size, 2)) MB"
          Get-Item dictation.exe | Select-Object Name, Length, LastWriteTime
        } else {
          Write-Host "✗ Build failed - binary not found"
          exit 1
        }
      shell: pwsh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dictation-windows-amd64
        path: dictation.exe
        retention-days: 30
