name: No comments

on:
  push:
    branches: [master, ceo/IGSH-585]
  pull_request:

jobs:
  no-comments:
    name: no-comments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test comment stripper
        run: go test -v ./cmd/strip-comments
      - name: No code comments
        run: go run ./cmd/strip-comments --check
