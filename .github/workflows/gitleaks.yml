# Copied into every repo agents push to by scripts/secret-scan in hypertask-ai/hypertask (YPER4-324).
# gitleaks finds key-shaped strings; trufflehog finds known key types. Any hit fails the check,
# because trufflehog's live check can call a working key dead. A false hit: `trufflehog:ignore` on its line.
name: Gitleaks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    # Deleting a branch adds no commits, so there is nothing to scan.
    if: github.event_name != 'push' || !github.event.deleted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Pick the commits to scan
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            # A pull request scans only the commits it adds.
            base="$PR_BASE_SHA"; head="$PR_HEAD_SHA"
          else
            # A push scans only the commits it adds. A new branch (or an unknown previous tip
            # after a force push) scans everything not already on the default branch; on the
            # default branch itself that means its whole history (empty base).
            head="$PUSH_HEAD_SHA"
            base=$(git rev-parse "origin/$DEFAULT_BRANCH")
            [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ] && base=""
            if [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
              base="$PUSH_BEFORE_SHA"
            fi
          fi
          echo "Scanning ${base:-the whole history}..$head"
          echo "SCAN_BASE=$base" >> "$GITHUB_ENV"
          echo "SCAN_HEAD=$head" >> "$GITHUB_ENV"
      - name: Run gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --no-banner --source . --redact --log-opts "${SCAN_BASE:+$SCAN_BASE..}$SCAN_HEAD"
      - name: Run trufflehog
        run: |
          curl -sSfL https://github.com/trufflesecurity/trufflehog/releases/download/v3.97.0/trufflehog_3.97.0_linux_amd64.tar.gz | tar -xz trufflehog
          # --json keeps values out of the plain log; only the key type and place are printed.
          set +e
          ./trufflehog git "file://$PWD" --branch "$SCAN_HEAD" ${SCAN_BASE:+--since-commit "$SCAN_BASE"} \
            --fail --no-update --json > found.json 2> trufflehog.err
          code=$?
          set -e
          grep -o '"DetectorName":"[^"]*"\|"file":"[^"]*"\|"commit":"[^"]*"' found.json || true
          grep -o '"chunks":[0-9]*\|"bytes":[0-9]*\|"verified_secrets":[0-9]*\|"unverified_secrets":[0-9]*' trufflehog.err | tr '\n' ' ' || true
          rm -f found.json
          if [ "$code" = 183 ]; then
            echo "::error::trufflehog found a key. Remove it, and roll it if it was ever real."
            exit 1
          fi
          if [ "$code" != 0 ]; then tail -5 trufflehog.err; exit "$code"; fi
