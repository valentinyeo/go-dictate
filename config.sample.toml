
profile = "terminal_agent"

[deepgram]
api_key = "YOUR_API_KEY_HERE"
language = "en"
model = "nova-3"
punctuate = true
smart_format = false
filler_words = false
holdback = true
keyterms = ["Codex", "PowerShell", "cmd.exe", "conhost", "go-dictate", "GitHub", "Deepgram", "Nova-3"]

[audio]
push_to_talk = false
silence_threshold_ms = 3000
duck_volume = 0.2
auto_pause_on_media = true
zero_latency = true
battery_budget_saver = false

[vad]
energy_threshold = 0.012
adaptive_noise = true
noise_multiplier = 3.0
min_start_threshold = 0.012
speech_start_chunks = 2
noise_mode = "normal"

[diagnostics]
save_failed_audio = false

[keyboard]
injection = "paste"
